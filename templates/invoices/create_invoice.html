<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Create Invoice | Qkeys.in
    </title>

    <style>

        body {

            font-family: Arial, sans-serif;

            background: #f4f4f4;

            margin: 0;

            padding: 40px;

        }

        .container {

            max-width: 700px;

            margin: auto;

            background: white;

            padding: 35px;

            border-radius: 10px;

        }

        .header {

            text-align: center;

            margin-bottom: 30px;

        }

        .header h1 {

            margin-bottom: 5px;

        }

        .header p {

            margin-top: 5px;

            color: #555;

        }

        h2 {

            text-align: center;

            margin-bottom: 30px;

        }

        label {

            display: block;

            font-weight: bold;

            margin-top: 18px;

        }

        input,
        select,
        textarea {

            width: 100%;

            padding: 11px;

            margin-top: 7px;

            box-sizing: border-box;

            border: 1px solid #ccc;

            border-radius: 5px;

        }

        button {

            width: 100%;

            padding: 13px;

            margin-top: 30px;

            background: #000;

            color: white;

            border: none;

            border-radius: 5px;

            font-size: 16px;

            cursor: pointer;

        }

        button:hover {

            background: #333;

        }

        .error {

            color: red;

            margin-bottom: 15px;

        }

        .gst-box {

            margin-top: 20px;

            padding: 12px;

            background: #f8f8f8;

            border-radius: 5px;

            font-weight: bold;

        }

    </style>

</head>


<body>


<div class="container">


    <!-- COMPANY -->

    <div class="header">

        <h1>
            Qkeys.in
        </h1>

        <p>
            A Real Estate Agency under
            13 CARDS PRODUCTION
        </p>

    </div>


    <h2>
        CREATE INVOICE
    </h2>


    <!-- FORM -->

    <form method="POST">

        {% csrf_token %}


        <!-- FORM ERRORS -->

        {% if form.non_field_errors %}

            <div class="error">

                {{ form.non_field_errors }}

            </div>

        {% endif %}


        <!-- CUSTOMER -->

        <label>
            Customer
        </label>

        {{ form.customer }}


        <!-- INVOICE DATE -->

        <label>
            Invoice Date
        </label>

        {{ form.invoice_date }}


        <!-- DESCRIPTION -->

        <label>
            Description
        </label>

        <input
            type="text"
            name="description"
            placeholder="Example: Real Estate Mediation Service"
            required
        >


        <!-- QUANTITY -->

        <label>
            Quantity
        </label>

        <input
            type="number"
            name="quantity"
            value="1"
            min="0.01"
            step="0.01"
            required
        >


        <!-- RATE -->

        <label>
            Rate / Amount
        </label>

        <input
            type="number"
            name="rate"
            placeholder="Enter amount"
            min="0"
            step="0.01"
            required
        >


        <!-- GST -->

        <div class="gst-box">

            GST:

            18%

            <br>

            GST will be automatically
            calculated.

        </div>


        <!-- NOTES -->

        <label>
            Notes
        </label>

        {{ form.notes }}


        <!-- SUBMIT -->

        <button type="submit">

            CREATE INVOICE

        </button>


    </form>


</div>


</body>

</html>
